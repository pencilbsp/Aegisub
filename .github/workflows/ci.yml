name: Meson CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows MSVC Release
            os: windows-latest
            msvc: true
            asset_platform: windows-x64
            devenv: |
              Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
              Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
            buildtype: release
            args: >-
              -Ddefault_library=static
              --force-fallback-for=zlib,harfbuzz,freetype2,fribidi,libpng
              -Dfallback_nasm=true
              -Dfreetype2:harfbuzz=disabled
              -Dharfbuzz:freetype=disabled
              -Dharfbuzz:cairo=disabled
              -Dharfbuzz:glib=disabled
              -Dharfbuzz:gobject=disabled
              -Dharfbuzz:tests=disabled
              -Dharfbuzz:docs=disabled
              -Dfribidi:tests=false
              -Dfribidi:docs=false
              -Dlibass:fontconfig=disabled
          #- {
          #  name: Windows MinGW,
          #  os: windows-latest,
          #  msvc: false
          #}
          # - {
          #   name: Ubuntu Debug,
          #   os: ubuntu-latest,
          #   buildtype: debugoptimized,
          #   args: -Db_pch=false
          # }
          - {
              name: Ubuntu Release,
              os: ubuntu-latest,
              buildtype: release,
              asset_platform: source,
              args: -Db_pch=false,
            }
          # - {
          #   name: macOS x86_64 Debug,
          #   os: macos-15-intel,
          #   buildtype: debugoptimized,
          #   args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          # }
          - {
              name: macOS x86_64 Release,
              os: macos-15-intel,
              buildtype: release,
              asset_platform: macos-x86_64,
              args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2,
            }
          # - {
          #   name: macOS arm64 Debug,
          #   os: macos-15,
          #   buildtype: debugoptimized,
          #   args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2
          # }
          - {
              name: macOS arm64 Release,
              os: macos-15,
              buildtype: release,
              asset_platform: macos-arm64,
              args: -Ddefault_library=static -Dbuild_osx_bundle=true -Dlocal_boost=true --force-fallback-for=ffms2,
            }

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: "0"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Meson
        run: |
          python -m pip install --upgrade pip setuptools
          pip install meson

        # Taken from https://github.com/libass/libass/blob/0.17.5/.github/workflows/meson.yml#L118-L125
      - name: Find Visual Studio
        if: matrix.config.msvc
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Could not find a Visual Studio installation" }
          "VS=$vsPath"
          "VS=$vsPath" >> $env:GITHUB_ENV

      - name: Remove Strawberry Perl from PATH
        if: matrix.config.os == 'windows-latest' && matrix.config.msvc == true
        run: |
          $cleanPath = $env:PATH -replace '[^;]*Strawberry[^;]*;?', ''
          echo "PATH=$cleanPath" >> $env:GITHUB_ENV

      - name: Select MSVC compiler
        if: matrix.config.os == 'windows-latest' && matrix.config.msvc == true
        run: |
          echo "CC=cl" >> $env:GITHUB_ENV
          echo "CXX=cl" >> $env:GITHUB_ENV

      - name: Install dependencies (Windows)
        if: matrix.config.os == 'windows-latest'
        run: |
          choco install ninja innosetup

          $moonscripturl = "https://github.com/leafo/moonscript/releases/download/v0.6.0/moonscript-v0.6.0-windows-x86_64.zip"
          mkdir moonscript
          Invoke-WebRequest -Uri $moonscripturl -OutFile ".\moonscript\moonscript.zip"
          pushd moonscript
          7z e moonscript.zip
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

          $gettexturl = "https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.18-r3/gettext1.0-iconv1.18-static-64.zip"
          Invoke-WebRequest -Uri $gettexturl -OutFile ".\gettext.zip"
          Expand-Archive ".\gettext.zip" -DestinationPath gettext
          pushd gettext/bin
          Get-Location | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          popd

      - name: Install dependencies (MacOS)
        if: startsWith(matrix.config.os, 'macos-')
        run: |
          # GitHub's Intel macOS runners can include a stale HashiCorp tap whose
          # vagrant formula fails to import during brew update/install.
          brew untap hashicorp/tap || true
          brew update

          # Uninstall system wxWidgets to force building the subproject with our patched files
          for pkg in wxmac wxwidgets; do
            if brew ls --versions $pkg > /dev/null; then
              brew uninstall --ignore-dependencies $pkg
            fi
          done

          brew install ninja
          brew install libass zlib ffms2 fftw hunspell
          # NO OpenAL in github CI. Intel runners can report a failed openssl@3
          # postinstall after pulseaudio has been installed, so accept an
          # already-installed pulseaudio after one repair attempt.
          brew install pulseaudio || {
            brew postinstall openssl@3 || true
            brew install pulseaudio || brew list --versions pulseaudio
          }

      - name: Install dependencies (Linux)
        if: startsWith(matrix.config.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build build-essential libx11-dev libfreetype6-dev pkg-config libfontconfig1-dev libass-dev libasound2-dev libffms2-dev intltool libboost-all-dev libhunspell-dev libcurl4-openssl-dev libuchardet-dev libgtest-dev libgmock-dev libwxgtk3.2-dev libportal-gtk3-dev

      - name: Configure
        run: |
          ${{ matrix.config.devenv }}
          meson setup build ${{ matrix.config.args }} -Dbuildtype=${{ matrix.config.buildtype }} ${{ github.ref_type == 'tag' && '-Dofficial_release=true' || '' }}

      - name: Build
        run: |
          ${{ matrix.config.devenv }}
          meson compile -C build

      - name: Run test
        run: |
          ${{ matrix.config.devenv }}
          meson test -C build --verbose "gtest main"

      # Windows artifacts
      - name: Generate Windows installer
        if: matrix.config.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ matrix.config.devenv }}
          meson compile win-installer -C build

      - name: Generate Windows portable installer
        if: matrix.config.os == 'windows-latest'
        run: |
          ${{ matrix.config.devenv }}
          cd build && ninja win-portable

      - name: Normalize Windows release assets
        if: matrix.config.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" -replace '^v', '' } else { "dev" }
          $assetDir = "build/release-assets"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null

          $installer = Get-ChildItem "build/Aegisub-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          Move-Item $installer.FullName "$assetDir/Aegisub-$version-${{ matrix.config.asset_platform }}.exe" -Force

          $portable = Get-ChildItem "build/aegisub-portable-*.zip" | Select-Object -First 1
          if (-not $portable) { throw "Windows portable package was not produced" }
          Move-Item $portable.FullName "$assetDir/Aegisub-$version-${{ matrix.config.asset_platform }}-portable.zip" -Force

      - name: Upload artifacts - win_installer
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - installer
          path: build/release-assets/Aegisub-*-windows-*.exe
          if-no-files-found: error

      - name: Upload artifacts - portable.zip
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'windows-latest'
        with:
          name: ${{ matrix.config.name }} - portable
          path: build/release-assets/Aegisub-*-windows-*-portable.zip
          if-no-files-found: error

      # macOS artifacts
      - name: Generate macOS installer
        if: startsWith(matrix.config.os, 'macos-')
        run: |
          meson compile osx-bundle -C build

          # Run osx-build-dmg but retry up to 10 times if it fails since hdiutil can be unreliable
          # See: https://github.com/actions/runner-images/issues/7522
          max_tries=10
          i=0
          until meson compile osx-build-dmg -C build ; do
            if [ $i -eq $max_tries ]; then
              echo "Error: osx-build-dmg failed after ${max_tries} tries."
              exit 1
            fi
            i=$((i+1))
          done

      - name: Normalize macOS release assets
        if: startsWith(matrix.config.os, 'macos-')
        run: |
          set -e

          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="dev"
          fi

          mkdir -p build/release-assets
          dmg=$(find build -maxdepth 1 -name 'Aegisub-*.dmg' -print -quit)
          if [ -z "${dmg}" ]; then
            echo "macOS dmg was not produced"
            exit 1
          fi
          mv "${dmg}" "build/release-assets/Aegisub-${version}-${{ matrix.config.asset_platform }}.dmg"

      - name: Upload artifacts - macOS dmg
        uses: actions/upload-artifact@v6
        if: startsWith(matrix.config.os, 'macos-')
        with:
          name: ${{ matrix.config.name }} - installer
          path: build/release-assets/Aegisub-*-macos-*.dmg
          if-no-files-found: error

      # Tarball
      - name: Generate tarball
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.buildtype == 'release'
        run: |
          set -e

          meson dist --include-subprojects -C build

          # Make sure the subprojects we need are included
          mkdir distcheck
          tar -xJf build/meson-dist/*.tar.xz -C distcheck/
          test -e distcheck/*/subprojects/luabins/meson.build
          test -e distcheck/*/subprojects/LuaJIT*/meson.build

          version="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="dev"
          fi

          mkdir -p build/release-assets
          mv build/meson-dist/*.tar.xz "build/release-assets/Aegisub-${version}-source.tar.xz"

      - name: Upload artifacts - tarball
        uses: actions/upload-artifact@v6
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.buildtype == 'release'
        with:
          name: Source Tarball
          path: build/release-assets/Aegisub-*-source.tar.xz
          if-no-files-found: error

      # GitHub Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.config.buildtype == 'release'
        with:
          files: build/release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
